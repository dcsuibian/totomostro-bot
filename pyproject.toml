[project]
name = "totomostro-bot"
version = "0.0.0"
description = "FF15 Totomostro Bot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torchaudio==2.9.1",
    "alembic>=1.18.4",
    "easyocr>=1.7.2",
    "mss>=10.1.0",
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "pywin32>=311",
    "scikit-learn>=1.8.0",
    "sqlalchemy>=2.0.46",
    "vgamepad>=0.1.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
